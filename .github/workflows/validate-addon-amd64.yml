name: HA Codex amd64 image validation

on:
  pull_request:
    paths:
      - "home_assistant_codex_app/**"
      - ".github/workflows/validate-addon-amd64.yml"
      - ".github/scripts/supervisor-options-fixture.cjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-smoke-test:
    name: Build and smoke-test amd64 add-on
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Read pinned build configuration
        id: build_config
        run: |
          build_file="home_assistant_codex_app/build.yaml"
          build_from="$(awk '$1 == "amd64:" {print $2}' "$build_file")"
          ttyd_version="$(awk '$1 == "TTYD_VERSION:" {gsub(/"/, "", $2); print $2}' "$build_file")"
          trzsz_version="$(awk '$1 == "TRZSZ_VERSION:" {gsub(/"/, "", $2); print $2}' "$build_file")"
          codex_version="$(awk '$1 == "CODEX_VERSION:" {gsub(/"/, "", $2); print $2}' "$build_file")"

          for value in "$build_from" "$ttyd_version" "$trzsz_version" "$codex_version"; do
            test -n "$value"
          done

          {
            echo "build_from=$build_from"
            echo "ttyd_version=$ttyd_version"
            echo "trzsz_version=$trzsz_version"
            echo "codex_version=$codex_version"
          } >> "$GITHUB_OUTPUT"

      - name: Build pinned amd64 add-on image
        run: |
          docker build \
            --platform linux/amd64 \
            --build-arg BUILD_FROM=${{ steps.build_config.outputs.build_from }} \
            --build-arg TTYD_VERSION=${{ steps.build_config.outputs.ttyd_version }} \
            --build-arg TRZSZ_VERSION=${{ steps.build_config.outputs.trzsz_version }} \
            --build-arg CODEX_VERSION=${{ steps.build_config.outputs.codex_version }} \
            --tag ha-codex:pr-${{ github.event.pull_request.number || github.run_id }} \
            home_assistant_codex_app

      - name: Verify runtime dependencies
        env:
          EXPECTED_CODEX_VERSION: ${{ steps.build_config.outputs.codex_version }}
        run: |
          image="ha-codex:pr-${{ github.event.pull_request.number || github.run_id }}"
          docker run --rm --env EXPECTED_CODEX_VERSION --entrypoint /bin/sh "$image" -ec '
            command -v codex
            test -x /usr/local/bin/codex
            test "$(codex --version)" = "codex-cli ${EXPECTED_CODEX_VERSION}"
            command -v codex-code-mode-host
            test -x /usr/local/bin/codex-code-mode-host
            codex-code-mode-host --help
            command -v node
            node --version
            if command -v npm >/dev/null 2>&1; then
              echo "npm must not be installed" >&2
              exit 1
            fi
          '

      - name: Verify image metadata
        run: |
          image="ha-codex:pr-${{ github.event.pull_request.number || github.run_id }}"
          test "$(docker image inspect "$image" --format '{{.Config.WorkingDir}}')" = "/homeassistant"
          test "$(docker image inspect "$image" --format '{{json .Config.Cmd}}')" = '["/run.sh"]'
          docker image inspect "$image" --format '{{json .Config.Healthcheck.Test}}' |
            grep -F 'http://127.0.0.1:7681/'

      - name: Verify configured models and healthy add-on startup
        run: |
          image="ha-codex:pr-${{ github.event.pull_request.number || github.run_id }}"
          options_file="$RUNNER_TEMP/ha-codex-options.json"
          printf '{}\n' > "$options_file"

          # Bashio reads options from Supervisor, not /data/options.json.
          # Supply only that read endpoint on an isolated CI network.
          docker network create --internal ha-codex-smoke
          docker run --detach \
            --name ha-codex-supervisor-fixture \
            --network ha-codex-smoke --network-alias supervisor \
            --volume "$options_file:/data/options.json:ro" \
            --volume "$PWD/.github/scripts/supervisor-options-fixture.cjs:/fixture.cjs:ro" \
            --entrypoint node "$image" /fixture.cjs

          for attempt in $(seq 1 20); do
            if docker exec ha-codex-supervisor-fixture curl --fail --silent http://127.0.0.1/addons/self/options/config; then
              break
            fi
            sleep 1
          done
          docker exec ha-codex-supervisor-fixture curl --fail --silent http://127.0.0.1/addons/self/options/config

          default_model="$(awk '$1 == "model:" && $2 !~ /^list\(/ {print $2}' home_assistant_codex_app/config.yaml)"
          test -n "$default_model"
          # Each case is model:selected effort:effort the add-on should use.
          # The last two check that a level the model lacks is lowered.
          for case in $(printf '%s\n' "$default_model:xhigh:xhigh" gpt-6-astra:ultra:ultra gpt-6-sol:xhigh:xhigh gpt-6-luna:max:max gpt-6-luna:ultra:max gpt-5.5:max:xhigh | awk '!seen[$0]++'); do
            IFS=: read -r model effort expected_effort <<< "$case"
            grep -E '^  model: list\(' home_assistant_codex_app/config.yaml | grep -F "$model"
            grep -E '^  reasoning_effort: list\(' home_assistant_codex_app/config.yaml | grep -E "[(|]${effort}[|)]"
            printf '{"model":"%s","reasoning_effort":"%s","terminal_font_size":14,"terminal_scrollback":5000,"terminal_theme":"dark","session_persistence":true,"preserve_terminal_history":true,"patch_compatibility_mode":true,"skip_command_approvals":false,"file_transfer":false,"memories":false,"home_assistant_control":false,"allow_home_assistant_restart":false}\n' "$model" "$effort" > "$options_file"
            docker run --detach --name ha-codex-runtime-smoke \
              --network ha-codex-smoke "$image"

            for attempt in $(seq 1 24); do
              status="$(docker inspect ha-codex-runtime-smoke --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}missing{{end}}')"
              if [ "$status" = "healthy" ]; then
                break
              fi
              if [ "$status" = "unhealthy" ] || [ "$(docker inspect ha-codex-runtime-smoke --format '{{.State.Running}}')" != "true" ]; then
                docker logs ha-codex-runtime-smoke
                exit 1
              fi
              sleep 5
            done

            test "$(docker inspect ha-codex-runtime-smoke --format '{{.State.Health.Status}}')" = "healthy"
            logs="$(docker logs ha-codex-runtime-smoke 2>&1)"
            printf '%s\n' "$logs"
            printf '%s\n' "$logs" | grep -F "Using Codex model: ${model}."
            printf '%s\n' "$logs" | grep -F "Reasoning effort: ${expected_effort}."
            if [ "$effort" != "$expected_effort" ]; then
              printf '%s\n' "$logs" | grep -F "Reasoning effort ${effort} is not available for ${model}; using ${expected_effort}"
            elif printf '%s\n' "$logs" | grep -F 'is not available for'; then
              exit 1
            fi
            printf '%s\n' "$logs" | grep -F 'Terminal history mode: inline.'
            printf '%s\n' "$logs" | grep -F 'Home Assistant control actions: false; Core restart: false.'
            printf '%s\n' "$logs" | grep -F 'Codex memories: false'
            printf '%s\n' "$logs" | grep -F 'Skip command approvals: false'
            if printf '%s\n' "$logs" | grep -E 'ERROR:|Failed to get addon config'; then
              exit 1
            fi
            docker rm --force ha-codex-runtime-smoke
          done

      - name: Clean up runtime containers and network
        if: always()
        run: |
          docker rm --force ha-codex-runtime-smoke ha-codex-supervisor-fixture 2>/dev/null || true
          docker network rm ha-codex-smoke 2>/dev/null || true
