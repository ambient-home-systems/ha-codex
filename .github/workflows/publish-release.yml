name: Publish HA Codex release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Add-on version to release, such as 1.2.16. Leave empty for the version in config.yaml.
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: publish-release

jobs:
  publish:
    name: Publish release
    # Tags must land on main's history, so refuse runs from other branches.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: bash .github/scripts/publish-release.sh
